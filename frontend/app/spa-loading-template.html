<style>
  /* App-shell skeleton, drawn in the same tokens as the live interface:
     canvas paper, ink wordmark, hairline rules, square controls. Only the
     wordmark is real content; everything else is a placeholder block. */
  #__nuxt-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    overflow: hidden;
    background: #f4f5f1;
    color: #0e1210;
    font-family:
      "Schibsted Grotesk",
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #__nuxt-loader *,
  #__nuxt-loader *::before,
  #__nuxt-loader *::after {
    box-sizing: border-box;
  }

  #__nuxt-loader .sk {
    display: block;
    border-radius: 2px;
    background-color: #e3e5dc;
    background-image: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.62) 50%,
      transparent 100%
    );
    background-repeat: no-repeat;
    background-size: 200% 100%;
    animation: sk-shimmer 1.6s ease-in-out infinite;
  }

  #__nuxt-loader .topbar {
    border-bottom: 1px solid #d6d8cf;
    background: rgba(244, 245, 241, 0.96);
  }

  #__nuxt-loader .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    height: 4rem;
    max-width: 72rem;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  #__nuxt-loader .brand {
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }

  #__nuxt-loader .mark {
    width: 1.75rem;
    height: 1.75rem;
    background: #0e1210;
  }

  #__nuxt-loader .wordmark {
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #__nuxt-loader .links {
    display: none;
    align-items: center;
    gap: 1.5rem;
  }

  #__nuxt-loader .links .sk {
    height: 0.5rem;
    width: 3.5rem;
  }

  #__nuxt-loader .links .sk:nth-child(2) {
    width: 4rem;
  }

  #__nuxt-loader .links .sk:nth-child(3) {
    width: 4.5rem;
  }

  #__nuxt-loader .links .sk:nth-child(4) {
    width: 5.25rem;
  }

  #__nuxt-loader .actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  #__nuxt-loader .actions .sk:first-child {
    width: 2.25rem;
    height: 2.25rem;
    border: 1px solid #d6d8cf;
    background-color: #ecede6;
  }

  #__nuxt-loader .actions .sk:last-child {
    width: 1.5rem;
    height: 1.5rem;
  }

  #__nuxt-loader .main {
    max-width: 72rem;
    margin: 0 auto;
    padding: 2rem 1.25rem;
  }

  #__nuxt-loader .head .sk:first-child {
    width: 5.5rem;
    height: 0.5rem;
  }

  #__nuxt-loader .head .sk:last-child {
    width: 13rem;
    max-width: 60%;
    height: 1.875rem;
    margin-top: 0.75rem;
    border-radius: 1px;
  }

  #__nuxt-loader .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 2.5rem;
    margin-top: 2rem;
  }

  #__nuxt-loader .rail .sk:first-child {
    width: 4.5rem;
    height: 0.5rem;
    margin-bottom: 1rem;
  }

  #__nuxt-loader .event {
    padding: 0.875rem 0;
    border-top: 1px solid #dddfd6;
  }

  #__nuxt-loader .event:last-child {
    border-bottom: 1px solid #dddfd6;
  }

  #__nuxt-loader .event .sk:first-child {
    width: 6.5rem;
    height: 0.4375rem;
  }

  #__nuxt-loader .event .sk:last-child {
    width: 11rem;
    max-width: 80%;
    height: 0.75rem;
    margin-top: 0.5rem;
  }

  #__nuxt-loader .panel {
    min-width: 0;
  }

  #__nuxt-loader .phase {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 3.25rem;
    padding: 0 1rem;
    background: #0e1210;
  }

  #__nuxt-loader .phase span {
    display: block;
    border-radius: 1px;
    background: rgba(255, 255, 255, 0.18);
  }

  #__nuxt-loader .phase span:first-child {
    width: 8.5rem;
    height: 0.5rem;
  }

  #__nuxt-loader .phase span:last-child {
    width: 2.75rem;
    height: 0.5rem;
  }

  #__nuxt-loader .media {
    height: 11rem;
    border: 1px solid #dddfd6;
    border-top: 0;
    border-radius: 0;
  }

  #__nuxt-loader .stats {
    display: flex;
    gap: 2.5rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid #d6d8cf;
  }

  #__nuxt-loader .stat .sk:first-child {
    width: 3.25rem;
    height: 1.625rem;
    border-radius: 1px;
  }

  #__nuxt-loader .stat .sk:last-child {
    width: 5rem;
    height: 0.5rem;
    margin-top: 0.625rem;
  }

  #__nuxt-loader .field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }

  #__nuxt-loader .field .sk:first-child {
    width: 4.75rem;
    height: 0.4375rem;
  }

  #__nuxt-loader .field .sk:last-child {
    height: 2.75rem;
    border-radius: 6px;
  }

  @keyframes sk-shimmer {
    from {
      background-position: -150% 0;
    }
    to {
      background-position: 250% 0;
    }
  }

  @media (min-width: 900px) {
    #__nuxt-loader .links {
      display: flex;
    }

    #__nuxt-loader .actions .sk:first-child {
      width: 2.5rem;
      height: 2.5rem;
    }
  }

  @media (min-width: 1024px) {
    #__nuxt-loader .topbar-inner {
      padding: 0 2rem;
    }

    #__nuxt-loader .main {
      padding: 2.5rem 2rem;
    }

    #__nuxt-loader .head .sk:last-child {
      width: 16rem;
      height: 2.25rem;
    }

    #__nuxt-loader .grid {
      grid-template-columns: 4fr 8fr;
      gap: 0;
      margin-top: 2.5rem;
    }

    #__nuxt-loader .rail {
      padding-right: 2rem;
    }

    #__nuxt-loader .panel {
      border-left: 1px solid #d6d8cf;
      padding-left: 2rem;
    }

    #__nuxt-loader .media {
      height: 18rem;
    }
  }

  @media (max-height: 740px) {
    #__nuxt-loader .event:nth-child(n + 3) {
      display: none;
    }

    #__nuxt-loader .media {
      height: 9rem;
    }

    #__nuxt-loader .field {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #__nuxt-loader .sk {
      animation: none;
      background-image: none;
    }
  }
</style>

<div
  class="loading-shell"
  role="status"
  aria-live="polite"
  aria-label="Loading COPAMS"
>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="wordmark">COPAMS</span>
      </div>

      <nav class="links" aria-hidden="true">
        <span class="sk"></span>
        <span class="sk"></span>
        <span class="sk"></span>
        <span class="sk"></span>
      </nav>

      <div class="actions" aria-hidden="true">
        <span class="sk"></span>
        <span class="sk"></span>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="head" aria-hidden="true">
      <span class="sk"></span>
      <span class="sk"></span>
    </div>

    <div class="grid">
      <aside class="rail" aria-hidden="true">
        <span class="sk"></span>

        <div class="event">
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
        <div class="event">
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
        <div class="event">
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
      </aside>

      <section class="panel" aria-hidden="true">
        <div class="phase">
          <span></span>
          <span></span>
        </div>

        <div class="media sk"></div>

        <div class="stats">
          <div class="stat">
            <span class="sk"></span>
            <span class="sk"></span>
          </div>
          <div class="stat">
            <span class="sk"></span>
            <span class="sk"></span>
          </div>
        </div>

        <div class="field">
          <span class="sk"></span>
          <span class="sk"></span>
        </div>
      </section>
    </div>
  </main>
</div>
